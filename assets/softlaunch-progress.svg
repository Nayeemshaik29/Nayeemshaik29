<rect x="28" y="58" width="0" height="14" rx="7" fill="url(#bar)"><animate attributeName="width" values="0;372" dur="1.6s" begin="0.2s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.7 0.2 1"/></rect>
<circle cx="372" cy="65" r="7" fill="#fff"><animate attributeName="opacity" values="0.35;1;0.35" dur="2s" repeatCount="indefinite"/></circle>
