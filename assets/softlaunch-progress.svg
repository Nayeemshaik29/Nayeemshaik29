<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 170" width="800" height="170" role="img" aria-label="SoftLaunch status: active development, 5 of 10 roadmap phases done. Done: registry, config, gateway security, user service, match service, Kafka notifications. Next: nearby feed, chat, verification, observability, AI assistant.">
<defs><linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#e63946"/><stop offset="1" stop-color="#3b82f6"/></linearGradient></defs>
<rect x="1" y="1" width="798" height="168" rx="16" fill="#0d1117" stroke="#1d4ed8" stroke-opacity="0.6" stroke-width="2"/>
<text x="28" y="40" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#e6edf3">SoftLaunch</text>
<text x="152" y="40" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#8b98b3">Spring Boot 4 microservices · active development</text>
<text x="772" y="40" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#e63946">5 / 10 phases</text>
